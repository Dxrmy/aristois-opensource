name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Python syntax check
        run: python3 -m py_compile scripts/*.py installer/*.py mappings/*.py

      - name: Fetch ASM
        run: |
          mkdir -p tools
          for a in asm asm-commons asm-tree asm-util asm-analysis; do
            curl -sSL -o "tools/$a-9.7.1.jar" \
              "https://repo1.maven.org/maven2/org/ow2/asm/$a/9.7.1/$a-9.7.1.jar"
          done

      - name: Compile recovery tools
        run: |
          CP="tools/asm-9.7.1.jar:tools/asm-commons-9.7.1.jar:tools/asm-tree-9.7.1.jar:tools/asm-util-9.7.1.jar:tools/asm-analysis-9.7.1.jar"
          javac --release 17 -cp "$CP" -d /tmp/tools tools/Remap.java tools/ResolveIndy.java

      - name: Check installer artifacts are reachable
        run: python3 installer/install.py --mc 1.21.4 --verify
