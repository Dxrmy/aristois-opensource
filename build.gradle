plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

version = '17.0.0'
group = 'me.deftware'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://jitpack.io/' }
    maven { url 'https://libraries.minecraft.net/' }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // NOTE: the framework, weaver and integrations are compiled from source in
    // src/main/java. Do NOT add libs/*.jar here: it duplicates those classes and
    // also drags in the proprietary client jar. libs/ is reference material only.
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
}

// Packages the clean-room client (org.aristois.client + client.json) as a
// standalone EMC mod jar. Drop the result into
//   <game>/libraries/EMC/<mc-version>/
// and the EMC framework will discover and load it.
tasks.register('emcClientJar', Jar) {
    group = 'aristois'
    description = 'Builds the loadable EMC client jar (org.aristois.client)'
    archiveBaseName = 'aristois-community-client'
    destinationDirectory = layout.buildDirectory.dir('emc')

    from(sourceSets.main.output) {
        include 'org/aristois/client/**'
        include 'assets/aristois/**'
        include 'client.json'
    }

    doLast {
        logger.lifecycle("EMC client jar -> ${archiveFile.get().asFile}")
        logger.lifecycle("Copy it to <game>/libraries/EMC/<minecraft-version>/")
    }
}